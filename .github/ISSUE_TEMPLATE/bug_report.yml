name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Keyboard and firmware
      description: From the Device tab, e.g. "Slice75 HE, App V1.1.7, protocol 1.0.7"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version
      description: Shown in the window title, e.g. 0.2.0
    validations:
      required: true
  - type: textarea
    id: selftest
    attributes:
      label: Self-test log (optional)
      description: Run `Slice75HE.exe --selftest selftest.log` and paste the file here.
      render: text
